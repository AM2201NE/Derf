name: Build Derf Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-build-512a1be

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    name: Build Derf APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinning versions prevents unexpected breakages from latest releases
          pip install buildozer==1.5.0 cython==3.0.11
          sudo apt-get update
          sudo apt-get install -y automake libltdl-dev pkg-config cmake

      - name: Verify repository state
        run: |
          echo "Current directory contents:"
          ls -la
          if [ ! -f "buildozer.spec" ]; then
            echo "❌ ERROR: buildozer.spec is missing from the root directory!"
            exit 1
          fi

      - name: Build APK
        run: |
          echo "Starting Buildozer Android debug build..."
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: derf-android-apk
          path: bin/*.apk
          if-no-files-found: error