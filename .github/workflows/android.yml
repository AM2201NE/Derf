name: Build Derf Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - test-invitation
      - android-build-512a1be

jobs:
  build:
    name: Build Derf APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android SDK licenses
        run: |
          mkdir -p /github/home/.buildozer/android/platform/android-sdk/licenses

          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > /github/home/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

          echo "d56f5187479451eabf01fb78af6dfcb131a6481e6" \
            >> /github/home/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            >> /github/home/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build APK
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: derf-android-apk
          path: bin/*.apk
          if-no-files-found: error
