name: Build Derf Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - test-invitation
      - android-build-512a1be

jobs:
  build:
    name: Build Derf APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/kivy/buildozer:latest

    env:
      ANDROID_HOME: /github/home/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /github/home/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "========================================"
          echo "ANDROID_HOME"
          echo "$SDK"
          echo "========================================"

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          python3 - <<'PY'
          import urllib.request

          url = "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          output = "/tmp/cmdline-tools.zip"

          print("Downloading Android command-line tools...")
          urllib.request.urlretrieve(url, output)
          print("Download complete.")
          PY

          echo "Extracting command-line tools..."

          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================"
          echo "Checking SDK manager files"
          echo "========================================"

          test -f "$SDKMANAGER"
          test -d "$SDK/cmdline-tools/latest/lib"

          ls -la "$SDK/cmdline-tools/latest/bin"
          echo ""
          ls -la "$SDK/cmdline-tools/latest/lib"

          echo "========================================"
          echo "SDK manager version"
          echo "========================================"

          "$SDKMANAGER" --version

          echo "========================================"
          echo "Accepting Android licenses"
          echo "========================================"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "========================================"
          echo "Installing Android packages"
          echo "========================================"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"

          echo "========================================"
          echo "Android SDK installed"
          echo "========================================"

          echo "SDK contents:"
          find "$SDK" -maxdepth 2 -type d | sort | head -100

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================"
          echo "Verifying Android SDK"
          echo "========================================"

          echo "sdkmanager:"
          command -v sdkmanager || true

          echo ""
          echo "SDK manager version:"
          "$SDKMANAGER" --version

          echo ""
          echo "Platforms:"
          ls -la "$SDK/platforms"

          echo ""
          echo "Build tools:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "AIDL:"
          find "$SDK/build-tools" \
            -type f \
            -name aidl \
            -print

          echo ""
          echo "========================================"
          echo "Android SDK verification passed"
          echo "========================================"

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Starting Buildozer Android build"
          echo "========================================"

          buildozer android debug

          echo "========================================"
          echo "Buildozer finished"
          echo "========================================"

      - name: Find APK
        shell: bash
        run: |
          echo "========================================"
          echo "APK files"
          echo "========================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: derf-android-apk
          path: bin/*.apk
          if-no-files-found: error
