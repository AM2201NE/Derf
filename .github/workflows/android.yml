name: Build Derf Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-build-512a1be

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    name: Build Derf APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==3.0.11
          sudo apt-get update
          sudo apt-get install -y automake libltdl-dev pkg-config cmake

      - name: Build APK (with automatic error printing)
        shell: bash
        run: |
          echo "Starting Buildozer Android debug build..."
          
          # Run buildozer and save output to a file while printing to console
          buildozer android debug 2>&1 | tee buildozer.log
          
          # Check if buildozer failed (PIPESTATUS[0] gets the exit code of buildozer, not tee)
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo ""
            echo "============================================================"
            echo "❌ BUILD FAILED! HERE ARE THE LAST 100 LINES OF THE LOG:"
            echo "============================================================"
            tail -n 100 buildozer.log
            echo "============================================================"
            exit 1
          fi
          
          echo "✅ Build completed successfully!"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: derf-android-apk
          path: bin/*.apk
          if-no-files-found: error