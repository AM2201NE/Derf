name: Build Derf Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - test-invitation
      - android-build-512a1be

jobs:
  build:
    name: Build Derf APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: derf-android-apk
          path: bin/*.apk
          if-no-files-found: error
