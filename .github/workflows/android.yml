name: Build Derf Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - test-invitation
      - android-build-512a1be

jobs:
  build:
    name: Build Derf APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/kivy/buildozer:latest

    env:
      ANDROID_HOME: /github/home/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /github/home/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "========================================"
          echo "Preparing Android SDK"
          echo "SDK: $SDK"
          echo "========================================"

          mkdir -p "$SDK/cmdline-tools"

          python3 - <<'PY'
          import urllib.request

          url = "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          output = "/tmp/cmdline-tools.zip"

          print("Downloading Android command-line tools...")
          print(url)

          urllib.request.urlretrieve(url, output)

          print("Android command-line tools downloaded successfully.")
          PY

          echo "Extracting command-line tools..."

          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"

          rm -rf "$SDK/cmdline-tools/latest"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo "Installing required Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"

          echo "Creating legacy SDK compatibility path..."

          mkdir -p "$SDK/tools"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/tools/bin"

          echo "========================================"
          echo "Android SDK preparation complete"
          echo "========================================"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "========================================"
          echo "ANDROID_HOME"
          echo "$ANDROID_HOME"
          echo "========================================"

          echo "Checking sdkmanager..."

          "$SDK/tools/bin/sdkmanager" --version

          echo "Checking Android platforms..."

          ls -la "$SDK/platforms"

          echo "Checking Android build-tools..."

          ls -la "$SDK/build-tools"

          echo "Searching for aidl..."

          find "$SDK/build-tools" \
            -name aidl \
            -type f \
            -print

          echo "Checking required aidl files..."

          test -f "$SDK/build-tools/33.0.2/aidl" || \
            test -f "$SDK/build-tools/35.0.0/aidl" || \
            test -f "$SDK/build-tools/37.0.0/aidl"

          echo "========================================"
          echo "Android SDK verification passed"
          echo "========================================"

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Starting Buildozer Android build"
          echo "========================================"

          buildozer android debug

          echo "========================================"
          echo "Buildozer finished"
          echo "========================================"

      - name: Find APK
        shell: bash
        run: |
          echo "========================================"
          echo "APK files"
          echo "========================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: derf-android-apk
          path: bin/*.apk
          if-no-files-found: error
